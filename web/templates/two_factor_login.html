{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h2>Second step</h2>
  <form method="post" action="{{ url_for('two_factor_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="otp">6-digit code</label>
    <input
      id="otp"
      name="otp"
      type="text"
      inputmode="numeric"
      pattern="[0-9 ]*"
      maxlength="12"
      autocomplete="one-time-code"
      required
      autofocus
    >
    <button type="submit">Continue</button>
  </form>
  <p style="margin-top: 1rem;"><a href="{{ url_for('login') }}">Back to login</a></p>
</section>
{% endblock %}
