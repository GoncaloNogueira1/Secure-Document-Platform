name: 1 - Continuous Integration
run-name: "${{ github.workflow }}"

on:
  push:
    branches:
      - main
      - ci/cd/basic-pipeline
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  WEB_IMAGE_NAME: secure-doc-platform-web
  DB_IMAGE_NAME: secure-doc-platform-db

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-bandit:
    name: SAST with Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (High severity only)
        run: bandit -r web -lll -x web/tests

  sast-semgrep:
    name: SAST with Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      # Report-only until Django CSRF false positives are triaged (.semgrepignore).
      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config auto web/

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r web/requirements.txt

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI compose override (no .env required)
        run: |
          printf '%s\n' \
            'services:' \
            '  web:' \
            '    env_file: []' \
            '    environment:' \
            '      SECRET_KEY: test-secret-key-for-ci-testing-only-never-in-prod' \
            '      CLAMD_HOST: clamd' \
            '      CLAMD_PORT: "3310"' \
            '      DOCUMENT_ANALYZER_URL: http://document-analyzer:9000/analyze' \
            '      FLASK_DEBUG: "false"' \
            '      SESSION_COOKIE_SECURE: "false"' \
            '      SESSION_TIMEOUT_MINUTES: "10"' \
            '      ANALYZER_LOG_LEVEL: INFO' \
            '      LOG_CLAM_RAW_RESPONSE: "false"' \
            '    ports:' \
            '      - "8000:8000"' \
            '  db:' \
            '    env_file: []' \
            '    environment:' \
            '      POSTGRES_PASSWORD: postgres' \
            '      POSTGRES_DB: docdb' \
            '      POSTGRES_USER: postgres' \
            '      APP_USER: app_user' \
            '      APP_ADMIN: app_admin' \
            '      DB_PORT: "5432"' \
            > docker-compose.ci.yml

      - name: Ensure .env exists for CI (safe test values)
        run: |
          if [ ! -f .env ]; then
            printf '%s\n' \
              'SECRET_KEY=test-secret-key-for-ci-testing-only-never-in-prod' \
              'POSTGRES_PASSWORD=postgres' \
              'APP_USER_PASSWORD=testappuser' \
              'APP_ADMIN_PASSWORD=testadminuser' \
              'DB_HOST=db' \
              'DB_PORT=5432' \
              'POSTGRES_DB=docdb' \
              'POSTGRES_USER=postgres' \
              'APP_USER=app_user' \
              'APP_ADMIN=app_admin' \
              'CLAMD_HOST=clamd' \
              'CLAMD_PORT=3310' \
              'DOCUMENT_ANALYZER_URL=http://document-analyzer:9000/analyze' \
              'FLASK_DEBUG=false' \
              'SESSION_COOKIE_SECURE=false' \
              'SESSION_TIMEOUT_MINUTES=10' \
              'ANALYZER_LOG_LEVEL=INFO' \
              'LOG_CLAM_RAW_RESPONSE=false' \
              > .env
          fi
      - name: Start application stack for validation (web + db only)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build web db

      - name: Wait for application
        run: |
          timeout=180
          elapsed=0

          until curl -fs http://localhost:8000/health > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Application did not become ready within ${timeout}s"
              echo "--- docker compose ps ---"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
              echo "--- web container logs (last 200 lines) ---"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 200 web || true
              exit 1
            fi

            echo "Waiting for application... (${elapsed}s elapsed)"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 50 web || true
            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "Application is ready"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run smoke tests
        run: |
          pytest -q tests/test_smoke.py

      - name: Stop stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, secrets, sast-bandit, sast-semgrep, sca]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/ci/cd/basic-pipeline')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image namespace
        run: |
          echo "IMAGE_NAMESPACE_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        run: |
          echo "WEB_SHA_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "DB_SHA_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE_LC }}/${{ env.DB_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Web: build once locally : scan + SBOM , then push same image to GHCR
      - name: Build web image (local tag for scan)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          tags: web:${{ github.sha }}
          provenance: false

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: web:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: web:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

      - name: Tag and push web image to GHCR
        run: |
          docker tag "web:${{ github.sha }}" "${WEB_SHA_TAG}"
          docker push "${WEB_SHA_TAG}"

      - name: Build and push db image
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: |
            ${{ env.DB_SHA_TAG }}
          provenance: false
