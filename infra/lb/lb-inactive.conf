upstream proxy_tier {
    zone proxy_tier 64k;
    server proxy1:8443 max_fails=1 fail_timeout=10s;
    server proxy2:8443 max_fails=1 fail_timeout=10s;
}

log_format endpoint_json escape=json
  '{'
    '"event_category":"proxy",'
    '"event_type":"proxy.request",'
    '"timestamp":"$time_iso8601",'
    '"severity":"info",'

    '"source_ip":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"scheme":"$scheme",'
    '"method":"$request_method",'
    '"endpoint":"$uri",'
    '"query_present":"$is_args",'
    '"status":$status,'

    '"bytes_sent":$body_bytes_sent,'
    '"request_length":$request_length,'
    '"request_time":$request_time,'

    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'

    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_id":"$request_id"'
  '}';

access_log /dev/stdout endpoint_json;
error_log /dev/stderr warn;

server {
    listen 8443 ssl;
    server_name _;

    client_max_body_size 10M;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    location / {
        proxy_pass https://proxy_tier;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
